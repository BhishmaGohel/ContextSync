<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master Prompt Control Panel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 40px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 { margin-top: 0; font-size: 24px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
    }
    textarea { height: 150px; resize: vertical; font-family: inherit; }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover { background-color: #0056b3; }
    .prompt-grid {
      margin-top: 30px;
      border-top: 1px solid #eaeaea;
      padding-top: 20px;
    }
    .prompt-card {
      background: #fdfdfd;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      position: relative;
    }
    .prompt-card h3 { margin: 0 0 10px 0; font-size: 18px; color: #007bff; }
    .prompt-card pre {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
      margin: 0;
    }
    .actions { margin-top: 15px; display: flex; justify-content: flex-end; }
    .btn-delete { background-color: #dc3545; }
    .btn-delete:hover { background-color: #bd2130; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Master Prompt Dashboard</h1>
    
    <div class="form-group">
      <label for="pName">Master Prompt Name (Key Unique Identifier)</label>
      <input type="text" id="pName" placeholder="e.g., Senior Academic Researcher">
    </div>
    
    <div class="form-group">
      <label for="pText">Master Prompt Text Structure</label>
      <textarea id="pText" placeholder="Paste structural constraints, rules, tone metrics here..."></textarea>
    </div>
    
    <button id="saveBtn">Save to Cloud Sync</button>

    <div class="prompt-grid" id="promptGrid">
      <h2>Your Saved Prompts</h2>
      <div id="listContainer"></div>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
