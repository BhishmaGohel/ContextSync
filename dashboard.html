<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master Prompt Control Panel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 40px;
      color: #333;
    }
    h1 {
      font-size: 24px;
      color: #087055;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .main-header { 
      display: flex;
      margin-top: 0;
      font-size: 24px;
      align-items: center;
      color: #087055
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(360px, 1.4fr);
      gap: 24px;
      margin-top: 24px;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }
    .panel h2 {
      margin: 0;
      font-size: 20px;
      color: #087055;
    }
    .panel-header-actions {
      color: #087055;
      display: flex;
      gap: 8px;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #6ea194;
      color: #087055;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s ease-in-out;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #087055; /* Changes border to your teal color */
    }
    input[type="text"]::placeholder, textarea::placeholder {
      color: #6ea194;   /* Muted teal color */
      opacity: 1;       /* Required for Firefox to display the correct opacity */
    }
    textarea { height: 240px; resize: vertical; font-family: inherit; }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      background-color: #529a88;
      color: #ffffff;
      border: 1px solid #087055;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.18s ease;
    }
    button:hover { 
      background-color: #087055;
      color: #ffffff;
    }
    .button-secondary {
      background-color: #ffffff;
      color: #087055;
      height: 40px;
      border: 1px solid #087055;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.18s ease;
    }
    .button-secondary:hover { 
      background-color: #087055;
      color: #ffffff;
     }
    .prompt-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .prompt-grid::-webkit-scrollbar {
      width: 6px;
    }
    .prompt-grid::-webkit-scrollbar-track {
      background: transparent;
    }
    .prompt-grid::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .prompt-grid::-webkit-scrollbar-thumb:hover {
      background: #FFFFFF;
    }
    .empty-state {
      padding: 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #087055;
      font-size: 14px;
      line-height: 1.6;
    }
    .prompt-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      margin-bottom: 4px;
    }
    .prompt-card h3 { margin: 0 0 10px 0; font-size: 18px; color: #087055; }
    .prompt-card pre {
      background: #087055;
      padding: 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
      margin: 0;
    }
    .prompt-card pre:hover {
      font-weight: bold;
    }
    .actions { margin-top: 16px; display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel-header">
      <div class="main-header">
        <h1>Master Prompt Dashboard</h1>
      </div>
      <div class="panel-header-actions">
        <button id="exportBtn" type="button" class="button" style="padding: 11px 18px; font-size: 14px;">Export</button>
        <button id="importBtn" type="button" class="button" style="padding: 11px 18px; font-size: 14px;">Import</button>
        <button id="showHiddenBtn" type="button" class="button" style="padding: 11px 18px; font-size: 14px;">Show Hidden</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" />
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-header">
          <h2>Prompts</h2>
        </div>
        <div id="listContainer"></div>
      </div>

      <div class="panel">
        <div class="form-group">
          <label for="pName" style="color: #087055;">Master Prompt Name (Key Unique Identifier)</label>
          <input type="text" id="pName" placeholder="e.g., Senior Academic Researcher">
        </div>

        <div class="form-group">
          <label for="pText" style="color: #087055;">Master Prompt Text Structure</label>
          <textarea id="pText" placeholder="Paste structural constraints, rules, tone metrics here..."></textarea>
        </div>

        <div class="button-row">
          <button id="saveBtn" class="button-secondary" style="padding: 8px 12px; font-size: 12px;">Save</button>
          <button id="updateBtn" type="button" class="button-secondary" style="padding: 8px 12px; font-size: 12px;">Update</button>
          <button id="cancelBtn" type="button" class="button-secondary" style="padding: 8px 12px; font-size: 12px;">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/dashboard/main.ts"></script>
</body>
</html>
